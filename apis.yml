aid: stllr-network
name: Stllr Network
description: >-
  Stllr Network is an AI-powered user-generated-content (UGC) and creator-marketing
  platform for the Arab world, connecting brands with a network of nano and micro
  content creators and influencers across categories such as beauty, entertainment,
  tech, lifestyle, parenting, gaming, fashion, fitness, and cooking. Its products
  include Remix, an AI tool that scales creator videos into multiple ad variations;
  Premier, a managed service that handles creator outreach and ad-campaign management;
  and pay-as-you-go video Packages (PAYG). The platform is brand- and consumer-facing,
  billed in Saudi Riyal (SAR), and sells through a fully published self-serve rate card
  of monthly UGC subscriptions and per-video bundles. It does not publish a public
  developer API, SDK, developer portal, or any API documentation: the string "API" does
  not appear anywhere on the marketing site. A real first-party backend does exist at
  api.stllr.network — the Next.js workspace at app.stllr.network calls its /v1/ routes,
  including TikTok and Google OAuth hand-offs — but it is an application backend with no
  published contract. Stllr has, by contrast, done deliberate agent-discovery work on its
  marketing surface: it serves a hand-written llms.txt and a robots.txt that explicitly
  allows OAI-SearchBot, ChatGPT-User, PerplexityBot, Claude-SearchBot, ClaudeBot and
  Google-Extended. Surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network for enrichment.
