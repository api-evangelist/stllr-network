note: >-
  Every /.well-known/ path probed on every Stllr Network host returned a miss. No
  security.txt, no OpenID/OAuth discovery document, no api-catalog, no
  ai-plugin.json and no A2A agent card is served anywhere on stllr.network or its
  subdomains. Recorded as a documented absence: NO WellKnown and NO SecurityTxt
  pointer is emitted in apis.yml, because either pointer would assert that the
  provider serves that surface.
  Two real documents WERE found on the marketing host and are captured: a
  first-party llms.txt (saved verbatim to llms/stllr-network-llms.txt) and a
  robots.txt that explicitly allows the named AI crawlers.
  One host, it.stllr.network, answers HTTP 200 with the same 1,360-byte HTML shell
  for EVERY path including all /.well-known/* paths — a Vite single-page-app
  catch-all ("Stllr It", built on Replit, still carrying the unedited default meta
  description). Every 200 on that host is a MISS, not a document, and no agent card
  was recorded from it.
