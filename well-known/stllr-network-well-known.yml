agent_posture:
  finding: agent-friendly-marketing-surface-no-agent-api
  detail: >-
    Stllr Network has clearly done deliberate agent/LLM-discovery work on its
    MARKETING surface — it publishes a hand-written llms.txt and a robots.txt that
    names and explicitly allows OAI-SearchBot, ChatGPT-User, PerplexityBot,
    Claude-SearchBot, ClaudeBot and Google-Extended. None of that reaches the product:
    there is no agent card, no MCP endpoint, no /.well-known discovery document, and
    no public API contract. The llms.txt itself says the product app is "not for SEO
    indexing". An agent can read about Stllr; it cannot transact with Stllr.
  evidence:
  - {url: 'https://www.stllr.network/llms.txt', http_status: 200, bytes: 1257}
  - {url: 'https://www.stllr.network/robots.txt', http_status: 200, bytes: 348}
